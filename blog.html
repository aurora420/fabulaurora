<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog — Fabulaurora</title>
  <meta name="description" content="Process write-ups, work logs and reflections across biomedicine, technology and art by Jeah Aurora Kim.">
  <link rel="icon" href="assets/img/brand/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/brand/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
  <main>
    <section class="page-head">
      <div class="wrap">
        <h1 class="display" data-i18n="blog.h1">Notes from the studio</h1>
        <p class="lede" data-i18n="blog.lede">Process write-ups, work logs and reflections across biomedicine, technology and art.</p>
      </div>
    </section>
    <section class="section section--tight" style="padding-top:0">
      <div class="wrap">
        <div class="blog-tools">
          <label class="search">
            <span class="sr-only" data-i18n="blog.search">Search notes</span>
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="5.2"/><path d="M12 12l4 4"/></svg>
            <input class="input" id="q" type="search" autocomplete="off" data-i18n-attr="placeholder:blog.search" placeholder="Search notes">
          </label>
          <div class="chips" id="cats" role="group" aria-label="Category"></div>
        </div>
        <div class="tagcloud" id="tags" role="group" data-i18n-attr="aria-label:blog.tags" aria-label="Tags"></div>
        <p class="count" id="count" aria-live="polite" style="margin:2rem 0 1.5rem"></p>
        <div class="post-list" id="posts"></div>
      </div>
    </section>
  </main>
  <script type="module" src="assets/js/blog.js"></script>
</body>
</html>
