<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Fabulaurora</title>
  <!-- GitHub Pages shows this for any unknown address, at any depth, so point relative links back at the site root. -->
  <script>
    (function () {
      var first = location.pathname.split('/')[1] || '';
      var base = /\.github\.io$/.test(location.hostname) && first ? '/' + first + '/' : '/';
      document.write('<base href="' + base + '">');
    })();
  </script>
  <link rel="icon" href="assets/img/brand/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
  <main>
    <section class="page-head" style="min-height:70vh">
      <div class="wrap about-top">
        <div>
          <h1 class="display" data-i18n="404.h">This room is empty</h1>
          <p class="lede" style="margin-top:1.1rem" data-i18n="404.p">The page you were looking for isn’t here. Try the gallery, or head back to the entrance.</p>
          <div class="row" style="margin-top:1.75rem">
            <a class="btn btn--primary" href="index.html" data-i18n="404.home">Back to the entrance</a>
            <a class="btn btn--ghost" href="gallery.html" data-i18n="hero.cta1">See the gallery</a>
          </div>
        </div>
        <div class="about-top__art"><img src="assets/img/avatars/sticker-anatomy.webp" alt="" width="760" height="760"></div>
      </div>
    </section>
  </main>
  <script type="module" src="assets/js/site.js"></script>
</body>
</html>
